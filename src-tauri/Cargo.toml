[package]
name = "lumi"
version = "0.1.0"
description = "Lumi – en studeapp för Windows"
authors = ["Lumi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["sync", "time"] }
futures-util = "0.3.34"
dotenvy = "0.15.7"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
# Argon2id för lösenord. Lösenordet lämnar aldrig backend och sparas aldrig
# i klartext – varken i frontend, i versionshanteringen eller i databasen.
argon2 = { version = "0.5", features = ["std", "password-hash"] }
# native-tls (SChannel på Windows) i stället för rustls: rustls drar in
# aws-lc-sys som kräver cmake, vilket inte behövs för att nå OpenRouter.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }
tauri-plugin-updater = { version = "2.13.3", default-features = false, features = ["native-tls", "zip", "system-proxy"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
